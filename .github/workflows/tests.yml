name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependencies
        run: python -m pip install --upgrade pip PySide6 pywin32 websockets onnxruntime numpy
      - name: Native tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: python -m unittest discover -s native -p "test_*.py" -q
      - name: Package contents
        shell: pwsh
        run: |
          $json = npm pack --dry-run --json | ConvertFrom-Json
          $files = $json[0].files | ForEach-Object { $_.path }
          if ($files -notcontains 'native/live_online.py') { throw 'live_online.py missing from package' }
          if ($files -notcontains 'requirements-native.txt') { throw 'requirements-native.txt missing from package' }
